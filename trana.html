<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Träning</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Träning">
<meta name="theme-color" content="#E2E8F2">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="icon" href="ikon-180.png">
<link rel="manifest" href="trana.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Egen träningssida, utan resten av Systemet. Datan sparas bara i den här webbläsaren. */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#E2E8F2;color:#15202B;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top,0px) 16px 60px}
footer{margin-top:28px;padding-top:14px;border-top:1px solid #D0D7DE;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;
  font-size:.8rem;color:#596572;text-align:center}
</style>
<link rel="stylesheet" href="trana.css?v=3">
</head>
<body class="flik-trana">
<div class="wrap">
  <main id="trana"></main>
  <footer>Datan finns bara i den här telefonen. Ta en backup ibland.</footer>
</div>
<script src="trana.js?v=3"></script>
<script>
// Egen nyckel, så att den här sidan aldrig delar data med Systemet på samma telefon.
const NYCKEL='trana:data';
function las(){try{return localStorage.getItem(NYCKEL);}catch(e){return null;}}
function skriv(v){try{localStorage.setItem(NYCKEL,v);}catch(e){}}

const rot=document.getElementById('trana');
if(window.Trana)Trana.mount({rot,las,skriv,backup:true});
else rot.textContent='Sidan kunde inte laddas. Kontrollera nätet och ladda om.';

// Har dygnet vänt när appen plockas upp igen laddas den om, så datumet stämmer.
const start=new Date().toDateString();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&new Date().toDateString()!==start)location.reload();});
</script>
</body>
</html>
